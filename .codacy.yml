---
exclude_paths:
  # AGENTS.md は AI エージェント向けの特殊な記述形式を含むため、
  # 一般的なドキュメントリンターによる誤検知を避けるために除外します。
  - "AGENTS.md"
  - "**/AGENTS.md"
engines:
  biome:
    exclude_paths:
      - ".opencode/plugins/custom-tools.ts"
  eslint:
    exclude_paths:
      - ".opencode/plugins/custom-tools.ts"
  remark-lint:
    exclude_paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
  markdownlint:
    exclude_paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
  proselint:
    exclude_paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
ignore_issues:
  - path: ".opencode/plugins/cursor-provider/agent-cleanup.ts"
    pattern: ".*non-static data.*"
  - path: "**/agent-cleanup.ts"
    pattern: ".*non-static data.*"
  - path: "**/agent-cleanup.ts"
    pattern: "Using non-static data to retrieve and run functions from the object is dangerous"
