---
exclude_paths:
  # AGENTS.md は AI エージェント向けの特殊な記述形式を含むため、
  # 一般的なドキュメントリンターによる誤検知を避けるために除外します。
  - "AGENTS.md"
  - "**/AGENTS.md"
engines:
  biome:
    exclude_paths:
      - ".opencode/plugins/custom-tools.ts"
  eslint:
    exclude_paths:
      - ".opencode/plugins/custom-tools.ts"
  remark-lint:
    exclude_paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
  markdownlint:
    exclude_paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
  proselint:
    exclude_paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
  duplication:
    exclude_paths:
      - "tests/**"
ignore_issues:
  - pattern: ".*Using non-static data to retrieve and run functions from the object is dangerous.*"
    files:
      - "src/agent-cleanup.ts"
  - pattern: ".*Complexity increasing per file.*"
    files:
      - "tests/agent-cleanup.test.ts"
  - pattern: ".*Clones added.*"
    files:
      - "tests/agent-cleanup.test.ts"
  - pattern: ".*allows user-controlled URLs to be passed directly to HTTP client libraries.*"
    files:
      - "src/auth.ts"
  - pattern: ".*Unhandled errors detected in asynchronous function.*"
    files:
      - "src/provider.ts"
  - pattern: ".*Unnecessary conditional, value is always.*"
    files:
      - "src/stream-proxy.ts"
