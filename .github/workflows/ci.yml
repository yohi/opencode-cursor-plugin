name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: typecheck & test (devcontainer)
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run Devcontainer with checks
        uses: devcontainers/ci@v0.3
        with:
          imageName: opencode-cursor-plugin-ci
          push: never
          runCmd: |
            set -euxo pipefail
            pnpm install --frozen-lockfile
            pnpm typecheck
            pnpm test
